[package]
name = "libredsp"
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
description = "DSP library in Rust"
repository = "https://github.com/libredsp/libredsp"
readme = "README.md"
keywords = ["dsp", "filter", "signal-processing"]

[dependencies]
num-complex = "0.4.6"
wasm-bindgen = "0.2.126"
nalgebra = "0.32"
rand = "0.10.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
serde-wasm-bindgen = "0.4"

[lib]
crate-type = ["cdylib", "rlib"]

[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "target-feature=-reference-types"
]
